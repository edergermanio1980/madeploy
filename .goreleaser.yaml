version: 2
project_name: madeploy
before:
  hooks:
    - go mod tidy
    - go test ./...
builds:
  - main: ./cmd/madeploy
    env: [CGO_ENABLED=0]
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    ldflags: ["-s -w -X main.version={{.Version}}"]
archives:
  - formats: [tar.gz]
    files: [README.md, CHANGELOG.md, docs/config.md, docs/runbook.md]
checksum:
  name_template: checksums.txt
changelog:
  use: git
